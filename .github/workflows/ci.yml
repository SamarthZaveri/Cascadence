name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cascadence
          POSTGRES_PASSWORD: cascadence
          POSTGRES_DB: cascadence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cascadence"
          --health-interval 5s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/neo4jpassword
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: cascadence
      POSTGRES_PASSWORD: cascadence
      POSTGRES_DB: cascadence
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-test-secret
      SEC_EDGAR_USER_AGENT: "Cascadence CI ci@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff mypy
      - run: ruff check .
      - run: mypy app --ignore-missing-imports
      - run: alembic upgrade head
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cascadence-backend:ci ./backend
      - run: docker build -t cascadence-frontend:ci ./frontend
