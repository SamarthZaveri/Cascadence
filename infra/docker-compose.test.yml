# Dedicated integration stores. This project does not use the local demo's data or ports.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cascadence
      POSTGRES_PASSWORD: cascadence
      POSTGRES_DB: cascadence_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascadence -d cascadence_test"]
      interval: 5s
      timeout: 5s
      retries: 15
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
  tests:
    build: ../backend
    environment:
      ENVIRONMENT: development
      POSTGRES_HOST: postgres
      POSTGRES_USER: cascadence
      POSTGRES_PASSWORD: cascadence
      POSTGRES_DB: cascadence_test
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MODEL_ARTIFACT_DIR: /tmp/model-artifacts
      INGESTION_CACHE_DIR: /tmp/ingestion-cache
      CASCADENCE_TEST_INTEGRATION: "1"
      CASCADENCE_TEST_NEO4J_ISOLATED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["sh", "-c", "alembic upgrade head && alembic check && pytest --cov=app"]
